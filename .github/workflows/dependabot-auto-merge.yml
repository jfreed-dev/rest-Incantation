name: Dependabot Auto-Merge

# Thin caller for the reusable workflow in freed-dev-llc/.github (a public
# org repo, so this personal-account repo can call it). Single source of
# truth lives there; this file should not diverge.
# This repo lives outside the org, so org secrets do not reach it: create a
# repo-level *Dependabot* secret named DEPENDABOT_AUTOMERGE_TOKEN instead.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    uses: freed-dev-llc/.github/.github/workflows/dependabot-auto-merge.yml@main
    secrets:
      DEPENDABOT_AUTOMERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
