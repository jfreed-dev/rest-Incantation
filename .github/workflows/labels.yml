name: Sync Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'

jobs:
  sync:
    runs-on: [self-hosted, linux]
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Sync labels
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
          dry-run: false
